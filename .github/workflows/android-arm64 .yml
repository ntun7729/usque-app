name: Android arm64-v8a Build & Test

on:
  push:
    branches:
      - feat/android-arm64-wireguard-warp
  workflow_dispatch:

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CMAKE_GENERATOR: Ninja
  FLUTTER_COMMIT: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
  FLUTTER_VERSION: 3.44.7

jobs:
  android-arm64:
    name: Android arm64-v8a Release Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter from pinned commit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" init
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "refs/tags/$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust and Android arm64-v8a toolchains
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
          rustup target add aarch64-linux-android
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Run Rust unit tests for selectable WARP mode
        run: |
          set -euo pipefail
          cargo test --locked -p usque-core --test warp_wireguard
          cargo test --locked -p usque-core config::data_plane::tests
          cargo test --locked -p usque-transport warp_wireguard::tests

      - name: Clippy Android arm64-v8a Rust
        shell: pwsh
        run: ./tool/build_android_rust.ps1 -AbiFilter arm64-v8a -CargoAction clippy

      - name: Resolve locked Flutter packages and run Flutter tests
        working-directory: apps/usque_gui
        run: |
          set -euo pipefail
          flutter --suppress-analytics pub get --enforce-lockfile
          flutter --suppress-analytics analyze --no-pub
          flutter --suppress-analytics test --no-pub --exclude-tags golden

      - name: Create ephemeral build-only signing identity
        env:
          STORE_PASSWORD: usque-build-only-password
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/usque-build-only.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias usque-build-only \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=Untrusted Usque CI Build, O=Usque Development, C=XX"

      - name: Build arm64-v8a Release APK
        working-directory: apps/usque_gui
        env:
          USQUE_ANDROID_ABI: arm64-v8a
          USQUE_ANDROID_KEYSTORE: ${{ runner.temp }}/usque-build-only.jks
          USQUE_ANDROID_STORE_PASSWORD: usque-build-only-password
          USQUE_ANDROID_KEY_ALIAS: usque-build-only
          USQUE_ANDROID_KEY_PASSWORD: usque-build-only-password
        run: |
          flutter --suppress-analytics build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --no-pub \
            --split-debug-info=build/symbols/android-arm64-v8a

      - name: Verify arm64-v8a APK packaging and signature
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          apksigner="$android_sdk/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          apk=apps/usque_gui/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          base_version_code="$(sed -nE 's/^version: [^+]+\+([0-9]+)\r?$/\1/p' apps/usque_gui/pubspec.yaml)"
          [[ "$base_version_code" =~ ^[1-9][0-9]*$ ]]
          declare -A abi_codes=(
            [app-arm64-v8a-release.apk]=2
          )
          declare -A expected_abis=(
            [app-arm64-v8a-release.apk]="arm64-v8a"
          )
          name="app-arm64-v8a-release.apk"
          read -r -a package_abis <<< "${expected_abis[$name]}"
          python tool/verify_android_apk.py --apk "$apk" \
            --abis "${package_abis[@]}" \
            --version-code "$((base_version_code * 1000 + abi_codes[$name]))" \
            --aapt2 "$android_sdk/build-tools/36.0.0/aapt2" \
            --zipalign "$android_sdk/build-tools/36.0.0/zipalign"
          "$apksigner" verify --verbose --print-certs "$apk"
          mkdir -p "$RUNNER_TEMP/arm64-apk"
          cp "$apk" "$RUNNER_TEMP/arm64-apk/usque-android-arm64-v8a-release.apk"

      - name: Upload verified arm64-v8a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: usque-android-arm64-v8a
          path: ${{ runner.temp }}/arm64-apk/usque-android-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral identity and build output
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/usque-build-only.jks"
          rm -rf apps/usque_gui/build apps/usque_gui/android/app/src/main/jniLibs
