name: Native WARP UDP transport tests

on:
  push:
    branches: [feature/android-wg-udp, feature/android-wg-native-actor, feature/android-wg-negotiated-tun]
    paths:
      - 'crates/usque-transport/**'
      - 'crates/usque-core/**'
      - '.github/workflows/native-warp-udp-test.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-warp-udp-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: WARP configuration contract tests
        run: cargo test -p usque-core warp_underlay --locked
      - name: New native WireGuard UDP tests
        run: cargo test -p usque-transport native_warp_udp --features wireguard --locked
      - name: Native WARP WireGuard actor tests
        run: cargo test -p usque-transport native_warp_wireguard --features wireguard --locked
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Transport Clippy
        run: cargo clippy -p usque-transport --features wireguard --all-targets --locked -- -D warnings
