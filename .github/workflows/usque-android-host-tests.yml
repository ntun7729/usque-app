name: Android WARP host lifecycle tests

on:
  push:
    branches:
      - feature/android-wg-native-actor
    paths:
      - 'apps/usque_gui/android/app/src/main/kotlin/io/github/georgexie2333/usque/AndroidVpnConfiguration.kt'
      - 'apps/usque_gui/android/app/src/main/kotlin/io/github/georgexie2333/usque/UsqueVpnService.kt'
      - 'apps/usque_gui/android/app/src/test/kotlin/io/github/georgexie2333/usque/AndroidVpnConfigurationTest.kt'
      - '.github/workflows/usque-android-host-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-warp-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --branch 3.44.7 --depth 1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "84fc5cbb223bc12f83d65b647ff8a56caf779ffd"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          "$android_sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Resolve Flutter packages
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics pub get --enforce-lockfile
      - name: Android VPN WARP unit tests
        working-directory: apps/usque_gui/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.georgexie2333.usque.AndroidVpnConfigurationTest --no-daemon --stacktrace
