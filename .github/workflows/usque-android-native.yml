name: Usque Android experimental APK

on:
  push:
    branches:
      - feature/android-wg-udp
      - feature/android-wg-native-actor
      - feature/android-wg-negotiated-tun
    paths:
      # Avoid expensive APK builds on every intermediate test/code commit.
      # Production bridge fix is the sole automatic APK build trigger.
      - 'apps/usque_gui/android/app/src/main/kotlin/io/github/georgexie2333/usque/NetworkQualityFields.kt'
  workflow_dispatch:

concurrency:
  group: android-native-warp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CMAKE_GENERATOR: Ninja
  FLUTTER_COMMIT: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
  FLUTTER_VERSION: 3.44.7

jobs:
  android:
    name: Android APK (arm64 only)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      USQUE_ANDROID_APPLICATION_ID: io.github.ntun7729.usque.experimental
    steps:
      - name: Checkout untrusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify vendored native sources and notices
        run: python tool/check_openvpn_sources.py

      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter from pinned commit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" init
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "refs/tags/$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust and Android toolchains
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
          rustup target add aarch64-linux-android
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Clippy Android Rust
        shell: pwsh
        run: ./tool/build_android_rust.ps1 -AbiFilter arm64-v8a -CargoAction clippy

      - name: Resolve locked Flutter packages
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics pub get --enforce-lockfile

      - name: Verify WARP selector and network settings
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics test test/warp_underlay_selector_test.dart test/network_settings_test.dart

      - name: Create ephemeral build-only signing identity
        env:
          STORE_PASSWORD: usque-build-only-password
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/usque-build-only.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias usque-build-only \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=Untrusted Usque CI Build, O=Usque Development, C=XX"

      - name: Build one ARM64 release APK
        working-directory: apps/usque_gui
        env:
          USQUE_ANDROID_ABI: arm64-v8a
          USQUE_ANDROID_KEYSTORE: ${{ runner.temp }}/usque-build-only.jks
          USQUE_ANDROID_STORE_PASSWORD: usque-build-only-password
          USQUE_ANDROID_KEY_ALIAS: usque-build-only
          USQUE_ANDROID_KEY_PASSWORD: usque-build-only-password
        run: |
          set -euo pipefail
          flutter --suppress-analytics build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --no-pub
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Verify ARM64 APK ABI, native Rust library and signature
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          apk="apps/usque_gui/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$apk"
          base_version_code="$(sed -nE 's/^version: [^+]+\+([0-9]+)\r?$/\1/p' apps/usque_gui/pubspec.yaml)"
          [[ "$base_version_code" =~ ^[1-9][0-9]*$ ]]
          python tool/verify_android_apk.py \
            --apk "$apk" \
            --abis arm64-v8a \
            --version-code "$((base_version_code * 1000 + 2))" \
            --aapt2 "$android_sdk/build-tools/36.0.0/aapt2" \
            --zipalign "$android_sdk/build-tools/36.0.0/zipalign"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/arm64.entries"
          grep -q '^lib/arm64-v8a/libusque_android\.so$' "$RUNNER_TEMP/arm64.entries"
          if grep -Eq '^lib/(armeabi-v7a|x86_64)/' "$RUNNER_TEMP/arm64.entries"; then
            echo "Non-arm64 native libraries found in ARM64 APK." >&2
            exit 1
          fi
          if grep -Eq 'kernel_blob\.bin|libVkLayer_khronos_validation\.so' "$RUNNER_TEMP/arm64.entries"; then
            echo "Debug artifacts found in release APK." >&2
            exit 1
          fi
          unzip -p "$apk" lib/arm64-v8a/libusque_android.so > "$RUNNER_TEMP/libusque_android.so"
          if readelf --sections "$RUNNER_TEMP/libusque_android.so" | grep -q '\.debug_info'; then
            echo "Rust JNI library contains debug information." >&2
            exit 1
          fi
          "$android_sdk/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"

      - name: Upload only one ARM64 APK, retain for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usque-native-wireguard-arm64
          path: apps/usque_gui/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Remove ephemeral identity and compile output
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/usque-build-only.jks"
          rm -rf apps/usque_gui/build apps/usque_gui/android/app/src/main/jniLibs

